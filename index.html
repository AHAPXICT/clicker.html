<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clicker</title>
    <style>
      :root {
        --background: 0 0% 100%;
        --foreground: 222.2 84% 4.9%;
        --muted: 210 40% 96.1%;
        --primary: 222.2 47.4% 11.2%;
        --secondary: 210 40% 96.1%;
        --radius: 0.5rem;
      }
      
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 2rem;
        gap: 2rem;
        background-color: hsl(var(--background));
      }
      
      .stats {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        background: hsl(var(--secondary));
        padding: 1.5rem;
        border-radius: var(--radius);
        width: 100%;
        max-width: 400px;
      }
      
      .click-area {
        background: hsl(var(--primary));
        color: white;
        padding: 2rem;
        border-radius: var(--radius);
        cursor: pointer;
        transition: transform 0.1s;
        user-select: none;
        text-align: center;
        z-index: 1000;
      }
      
      .click-area:active {
        transform: scale(0.95);
      }
      
      .upgrades {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        width: 100%;
        max-width: 400px;
      }
      
      .upgrade-btn {
        background: hsl(var(--background));
        border: 1px solid hsl(var(--muted));
        padding: 1rem;
        border-radius: var(--radius);
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      
      .upgrade-btn:hover:not(.disabled) {
        background: hsl(var(--muted));
      }
      
      .disabled {
        opacity: 0.5;
        cursor: not-allowed;
        pointer-events: none;
      }
      
      .counter {
        font-size: 2rem;
        font-weight: 600;
        color: hsl(var(--foreground));
      }
    </style>
  </head>
  <body>
    <div class="stats">
      <div class="counter" id="counter">0 points</div>
      <div>Passive income: <span id="passiveIncome">0</span>/s</div>
    </div>
    
    <div class="click-area" id="clickArea">
      Click me!
    </div>
    
    <div class="upgrades">
      <div class="upgrade-btn" id="clickUpgrade">
        <span>Click Power (+1)</span>
        <span id="clickCost">Cost: 10</span>
      </div>
      <div class="upgrade-btn" id="autoUpgrade">
        <span>Auto Clicker (+1/s)</span>
        <span id="autoCost">Cost: 50</span>
      </div>
    </div>
    
    
    <script>
      // Состояние игры
      let gameState = {
        pointsString: 'points',
        pointsDiv: 1,
        points: 0,
        clickPower: 1,
        passiveIncome: 0,
        clickBaseCost: 10,
        autoBaseCost: 50
      }
      firstClick = true;
      
      const elements = {
        counter: document.getElementById('counter'),
        clickArea: document.getElementById('clickArea'),
        clickUpgrade: document.getElementById('clickUpgrade'),
        autoUpgrade: document.getElementById('autoUpgrade'),
        passiveIncomeDisplay: document.getElementById('passiveIncome'),
        clickCost: document.getElementById('clickCost'),
        autoCost: document.getElementById('autoCost')
      };
      
      function handleClick() {
        gameState.points += gameState.clickPower;
        updateDisplay();
        
        let a = false;
        if (firstClick) {
          let id1;
          let id2;
          setInterval(() => {
            if (a) {
              id1 = setInterval(right, 1)
              clearInterval(id2)
            }
            else {
              id2 = setInterval(left, 1)
              clearInterval(id1)
            }
            a = !a
                  }, 2000)
        }
        firstClick = false;
      }
      
     function right() {
       elements.clickArea.style.transform += `translateY(${1}px)`;
       elements.clickArea.style.transform += `translateX(${1}px)`;
       elements.clickArea.style.transform += `translateZ(${1}px)`;
       elements.clickArea.style.transform += `rotateX(${-1}deg)`;
       elements.clickArea.style.transform += `rotateY(${1}deg)`;
       elements.clickArea.style.transform += `rotateZ(${-1}deg)`;
     }
     
     function left() {
       elements.clickArea.style.transform += `translateY(${-1}px)`;
       elements.clickArea.style.transform += `translateX(${-1}px)`;
       elements.clickArea.style.transform += `translateZ(${-1}px)`;
       elements.clickArea.style.transform += `rotateX(${1}deg)`;
       elements.clickArea.style.transform += `rotateY(${1}deg)`;
       elements.clickArea.style.transform += `rotateZ(${1}deg)`;
     }
      
      function getClickUpgradeCost() {
        return Math.round(gameState.clickBaseCost * (1.5 ** gameState.clickPower));
      }
      
      function getAutoUpgradeCost() {
        return Math.round(gameState.autoBaseCost * (1.5 ** gameState.passiveIncome));
      }
      
      function buyClickUpgrade() {
        const cost = getClickUpgradeCost();
        if (gameState.points >= cost) {
          gameState.points -= cost;
          gameState.clickPower++;
          updateDisplay();
        }
      }
      
      function buyAutoUpgrade() {
        const cost = getAutoUpgradeCost();
        if (gameState.points >= cost) {
          gameState.points -= cost;
          gameState.passiveIncome++;
          updateDisplay();
        }
      }
      
      function updateDisplay() {
        if (gameState.points >= 1000) {
          gameState.pointsString = 'megaPoints'
          gameState.pointsDiv = 1000
        }
        else {
          gameState.pointsString = 'Points'
          gameState.pointsDiv = 1
        }
        
        // Обновление счетчиков
        elements.counter.textContent = `${Math.floor(gameState.points) / gameState.pointsDiv} ${gameState.pointsString}`;
        elements.passiveIncomeDisplay.textContent = gameState.passiveIncome;
        
        // Обновление цен
        elements.clickCost.textContent = `Cost: ${getClickUpgradeCost()}`;
        elements.autoCost.textContent = `Cost: ${getAutoUpgradeCost()}`;
        
        // Состояние кнопок
        elements.clickUpgrade.classList.toggle('disabled', gameState.points < getClickUpgradeCost());
        elements.autoUpgrade.classList.toggle('disabled', gameState.points < getAutoUpgradeCost());

        localStorage.setItem('gameState', JSON.stringify(gameState));
      }
      
      // Инициализация игры
      function initGame() {
        // Назначение обработчиков
        elements.clickArea.addEventListener('click', handleClick);
        elements.clickUpgrade.addEventListener('click', buyClickUpgrade);
        elements.autoUpgrade.addEventListener('click', buyAutoUpgrade);
        
        const save = localStorage.getItem('gameState')
        const s = JSON.parse(save)
        if (s != null && s != undefined) {
          gameState = s
        }
        
        // Запуск пассивного дохода
        setInterval(() => {
          gameState.points += gameState.passiveIncome;
          updateDisplay();
        }, 1000);
        
        updateDisplay();
      }

      
      // Запуск игры
      initGame();
    </script>
  </body>
</html>
